[package]
name = "voice-assistant"
version = "0.1.0"
edition = "2024"

[dependencies]

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

# Audio I/O
cpal = "0.18.1"

# Config / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# WAV read/write for the offline (file-based) Termux pipeline.
hound = "3.5"

# HTTP client for Python TTS service
reqwest = { version = "0.13", default-features = false, features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Errors
anyhow = "1"
thiserror = "2"

# --- Native ML backends ---
# LLM — pin exact versions together with Cargo.lock. On Android/Termux the
# binary is cross-compiled on the host with the Android NDK, so the -sys crate's
# NDK requirement is satisfied (it would fail only if built inside Termux,
# which has no NDK).
llama-cpp-2 = "=0.1.153"
# The -sys crate must match exactly: 0.1.154 changed the FFI struct layout and
# breaks the 0.1.153 wrapper (use_mmap/use_mlock fields removed upstream).
llama-cpp-sys-2 = "=0.1.153"
# UTF-8 incremental decoder used by the LLM backend.
encoding_rs = "0.8"
# STT — pinned commit; default-features off to skip the macOS-only `metal` backend.
transcribe-cpp = { git = "https://github.com/handy-computer/transcribe.cpp.git", rev = "856d7c10a1a864b900e066b7c9801edf373f5148", package = "transcribe-cpp", default-features = false }
# VAD tensor handling (used by src/vad).
ndarray = "0.16"

# VAD — ort version taken from the current Silero VAD Rust example Cargo.toml.
# On desktop we keep the default `download-binaries` feature (ort fetches a
# prebuilt ONNX Runtime). For Android cross-compilation with NDK the binary
# needs the aarch64 `libonnxruntime.so`; the ort crate's download-binaries
# feature does not fetch an android build, so cross-builds should set
# `ORT_LIB_LOCATION` (see README). We keep the default feature set here so
# desktop builds are unchanged; android cross-builds override via env.
ort = { version = "=2.0.0-rc.10", features = ["ndarray"] }

[profile.release]
opt-level = 3
lto = "thin"
