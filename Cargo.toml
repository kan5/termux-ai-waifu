[package]
name = "voice-assistant"
version = "0.1.0"
edition = "2024"

[dependencies]

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

# Config / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# HTTP client for Python TTS service
reqwest = { version = "0.13", default-features = false, features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Errors
anyhow = "1"
thiserror = "2"

# --- Native ML backends (used on all targets; on Android they cross-compile
# via the host NDK, satisfying the -sys crates' NDK requirement) ---
# LLM — pin exact versions together with Cargo.lock.
llama-cpp-2 = "=0.1.153"
# The -sys crate must match exactly: 0.1.154 changed the FFI struct layout and
# breaks the 0.1.153 wrapper (use_mmap/use_mlock fields removed upstream).
llama-cpp-sys-2 = "=0.1.153"
# UTF-8 incremental decoder used by the LLM backend.
encoding_rs = "0.8"
# STT — pinned commit; default-features off to skip the macOS-only `metal` backend.
transcribe-cpp = { git = "https://github.com/handy-computer/transcribe.cpp.git", rev = "856d7c10a1a864b900e066b7c9801edf373f5148", package = "transcribe-cpp", default-features = false }
# VAD tensor handling (used by src/vad).
ndarray = "0.16"

# --- Desktop-only dependencies ---
# On Android/Termux the live CPAL pipeline and its audio module are compiled
# out: CPAL can't drive the mic/speakers (no ALSA) and its AAudio backend pulls
# in -laudio/-lpthread that fail to link. Android uses the file-based offline
# pipeline + Termux:API instead. ort keeps `download-binaries` (prebuilt ORT).
[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = "0.18.1"
ort = { version = "=2.0.0-rc.10", features = ["ndarray"] }

# --- Android/Termux-only dependencies ---
# ort's `download-binaries` feature does not even COMPILE on the android target
# (its build.rs imports dirs::cache_dir, defined only for linux/macos/windows)
# and has no aarch64-android prebuilt anyway. So on Android we use
# `load-dynamic` and dlopen a system libonnxruntime.so (the Termux `onnxruntime`
# pkg, or a copy next to the binary); see README.
[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["ndarray", "load-dynamic"] }

[profile.release]
opt-level = 3
lto = "thin"
