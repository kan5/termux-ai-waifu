[package]
name = "voice-assistant"
version = "0.1.0"
edition = "2024"

[dependencies]

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

# Audio I/O
cpal = "0.18.1"

# Config / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# WAV read/write for the offline (file-based) Termux pipeline.
hound = "3.5"

# HTTP client for Python TTS service
reqwest = { version = "0.13", default-features = false, features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Errors
anyhow = "1"
thiserror = "2"

# --- Native ML backends (enabled one at a time, see phases) ---
# STT — pinned commit; default-features off to skip the macOS-only `metal` backend.
transcribe-cpp = { git = "https://github.com/handy-computer/transcribe.cpp.git", rev = "856d7c10a1a864b900e066b7c9801edf373f5148", package = "transcribe-cpp", default-features = false }
# VAD tensor handling (used by src/vad).
ndarray = "0.16"
# UTF-8 incremental decoder used by both LLM backends (qwen.rs / native.rs).
encoding_rs = "0.8"

# Dynamic loading of the system libllama.so on Android/Termux (native LLM
# backend). On desktop llama-cpp-2 is used instead, but this crate is harmless.
libloading = "0.8"

# --- Desktop-only native backends ---
# llama-cpp-2 / llama-cpp-sys-2 are NOT available on Android/Termux: the -sys
# crate's build.rs requires the Android NDK on aarch64-linux-android (any
# version), which Termux does not ship. On Android we use the system libllama.so
# via `native.rs` instead, so these crates are excluded from that target.
[target.'cfg(not(target_os = "android"))'.dependencies]
# LLM — pin exact versions together with Cargo.lock.
llama-cpp-2 = "=0.1.153"
# The -sys crate must match exactly: 0.1.154 changed the FFI struct layout and
# breaks the 0.1.153 wrapper (use_mmap/use_mlock fields removed upstream).
llama-cpp-sys-2 = "=0.1.153"
# ort — see comment above: desktop keeps download-binaries (prebuilt ORT).
ort = { version = "=2.0.0-rc.10", features = ["ndarray"] }

# --- Android/Termux-only native backends ---
[target.'cfg(target_os = "android")'.dependencies]
# ort: load-dynamic loads the system libonnxruntime.so (onnxruntime pkg) via dlopen.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["ndarray", "load-dynamic"] }

[profile.release]
opt-level = 3
lto = "thin"
